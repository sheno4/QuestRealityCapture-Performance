name: Build Quest APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    # Meta XR SDK 203's Runtime Optimizer does not compile under the Linux editor.
    runs-on: windows-2022
    timeout-minutes: 90
    concurrency:
      group: quest-apk
      cancel-in-progress: false
    steps:
      - name: Check Unity activation settings
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:UNITY_EMAIL -or !$env:UNITY_PASSWORD -or (!$env:UNITY_LICENSE -and !$env:UNITY_SERIAL)) {
            Write-Output "::error::Set UNITY_EMAIL and UNITY_PASSWORD, plus UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro), in the repository's Actions secrets."
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Wait for Windows Docker
        shell: powershell
        run: |
          Start-Service docker
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            docker info --format '{{.OSType}}' 2>$null
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 6
          }
          throw 'Docker did not start on the Windows runner.'

      - name: Build Android APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.4.5f1
          customImage: unityci/editor:windows-6000.4.5f1-android-3.2.2
          androidExportType: androidPackage
          buildName: QuestRealityCapture-Performance
          buildsPath: build
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: QuestRealityCapture-Performance-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
